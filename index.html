<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Право выбора · что сейчас в работе</title>
<meta name="description" content="Статус задач по контенту: что сделано, что делается сейчас, когда будет готово.">
<meta property="og:title" content="Право выбора · что сейчас в работе">
<meta property="og:description" content="Статус задач по контенту: что сделано, что делается сейчас, когда будет готово.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F2; --card:#FAFAF8; --line:#E2E3DE; --ink:#14171C; --muted:#5E636B;
  --accent:#14505C; --track:#F2E6C8; --now:#E9A34B; --todo:#B9BCB6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171C; --card:#1C2026; --line:#2C313A; --ink:#F4F5F2; --muted:#A3A8AF;
         --accent:#6FB2BE; --track:#2E3440; --now:#E9A34B; --todo:#59606B; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 "Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
header h1{font:600 22px/1.2 "Unbounded","Onest",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.upd{color:var(--muted);font-size:14px;margin:0 0 24px}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 10px}

.task{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 12px;overflow:hidden}
.task>summary{list-style:none;cursor:pointer;padding:16px 16px 14px;display:block}
.task>summary::-webkit-details-marker{display:none}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.title{font-size:18px;font-weight:600;line-height:1.25}
.chev{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--muted);transition:transform .2s}
details[open]>summary .chev{transform:rotate(180deg)}
.now-line{margin:6px 0 10px;font-size:15px}
.now-line b{font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--now);margin-right:8px;vertical-align:1px}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-top:8px;font-size:14px;color:var(--muted)}
.meta .due{color:var(--ink);font-weight:500}

.steps{list-style:none;margin:0;padding:4px 16px 16px;border-top:1px solid var(--line)}
.step{position:relative;padding:12px 0 0 32px}
.step:before{content:"";position:absolute;left:10px;top:34px;bottom:-12px;width:2px;background:var(--line)}
.step:last-child:before{display:none}
.ic{position:absolute;left:0;top:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.step.done>.ic{background:var(--accent);color:var(--bg)}
.step.now>.ic{background:var(--now);color:#14171C}
.step.todo>.ic{border:2px solid var(--todo)}
.sname{font-weight:500}
.step.todo>.sname{color:var(--muted)}
.hint{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.tag{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}

.sub{margin-top:6px}
.sub>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}
.sub>summary::-webkit-details-marker{display:none}
.sub>summary .more{font-size:13px;color:var(--accent);font-weight:500}
.sub[open]>summary .more .x{display:inline}
.sub>summary .more .x{display:none}
.sub[open]>summary .more .y{display:none}
.substeps{list-style:none;margin:6px 0 0;padding:0}
.substeps .step{padding-left:30px}
.substeps .ic{width:18px;height:18px;top:14px;font-size:11px}
.substeps .step:before{left:8px;top:34px}

.plats{list-style:none;margin:0;padding:8px 16px 16px;border-top:1px solid var(--line)}
.plat{padding:10px 0;border-bottom:1px solid var(--line)}
.plat:last-child{border-bottom:0}
.plat .row{align-items:center}
.pn{font-weight:500}
.pc{font-size:13px;color:var(--muted);white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.pnote{font-size:13px;color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:0 0 16px}
.tabs button{appearance:none;background:none;border:0;padding:8px 0 10px;margin-bottom:-1px;font:inherit;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel[hidden]{display:none}
.done-list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px}
.done-item{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.done-item:last-child{border-bottom:0}
.num{flex:none;min-width:44px;font:600 22px/1.1 "Unbounded","Onest",system-ui,sans-serif;color:var(--accent)}
.num.ok{font-size:18px}
.dtitle{font-weight:600}
.ddetail{display:block;font-size:14px;color:var(--muted);margin-top:2px}
footer{margin-top:28px;font-size:13px;color:var(--muted)}
.err{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Право выбора · контент</h1>
    <p class="upd" id="upd">&nbsp;</p>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="t-now" aria-selected="true" data-tab="now">Сейчас в работе</button>
    <button role="tab" id="t-done" aria-selected="false" data-tab="done">Сделано</button>
  </nav>
  <section class="panel" id="p-now" role="tabpanel">
    <div id="tasks"></div>
    <footer>Нажмите на задачу, чтобы увидеть все этапы. Время указано по Иркутску.</footer>
  </section>
  <section class="panel" id="p-done" role="tabpanel" hidden>
    <h2 id="done-h"></h2>
    <ul class="done-list" id="done"></ul>
  </section>
</div>
<script>
const TZ = 'Asia/Irkutsk';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayKey = d => new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d);
const hm = d => new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}).format(d);
const dm = d => new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,day:'numeric',month:'long'}).format(d);
const hmMsk = d => new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit'}).format(d);

function when(iso){
  const d = new Date(iso), now = new Date();
  const t = dayKey(now), tm = dayKey(new Date(now.getTime()+864e5));
  const endOfDay = hm(d) === '23:59';
  let day = dayKey(d) === t ? 'сегодня' : dayKey(d) === tm ? 'завтра' : dm(d);
  return endOfDay ? day : `${day}, ${hm(d)}`;
}
function leaves(steps){
  let done=0,total=0;
  for(const s of steps){
    if(s.sub){ for(const x of s.sub){ total++; if(x.status==='done') done++; } }
    else { total++; if(s.status==='done') done++; }
  }
  return {done,total};
}
const ICON = {done:'✓', now:'', todo:''};
function stepHTML(s){
  const tag = s.status==='now' ? '<span class="tag">сейчас</span>' : '';
  const hint = s.hint ? `<span class="hint">${esc(s.hint)}</span>` : '';
  let inner = `<span class="sname">${esc(s.name)}</span>${tag}${hint}`;
  if(s.sub){
    const d = s.sub.filter(x=>x.status==='done').length;
    inner = `<details class="sub"><summary><span class="sname">${esc(s.name)} · ${d} из ${s.sub.length}</span>${tag}
      <span class="more"><span class="y">все этапы ▾</span><span class="x">свернуть ▴</span></span></summary>
      <ul class="substeps">${s.sub.map(stepHTML).join('')}</ul></details>`;
  }
  return `<li class="step ${s.status}"><span class="ic">${ICON[s.status]}</span>${inner}</li>`;
}
function taskHTML(t){
  let done,total,nowText,body;
  if(t.platforms){
    const P=t.platforms, n=P.stages.length;
    done = P.list.reduce((a,p)=>a+p.done,0); total = P.list.length*n;
    const ready = P.list.filter(p=>p.done>=n).length;
    nowText = `<b>Готово площадок: ${ready} из ${P.list.length}</b>`;
    body = `<ul class="plats">${P.list.map(p=>`
      <li class="plat"><div class="row"><span class="pn">${esc(p.name)}</span>
      <span class="pc">${p.done>=n?'готово':p.done+' из '+n}</span></div>
      <div class="pills">${P.stages.map((s,i)=>`<span class="pill${i<p.done?' ok':''}">${i<p.done?'✓ ':''}${esc(s)}</span>`).join('')}</div>
      ${p.note?`<div class="pnote">${esc(p.note)}</div>`:''}</li>`).join('')}</ul>`;
  } else {
    ({done,total} = leaves(t.steps));
    const cur = t.steps.find(s=>s.status==='now');
    if(cur){
      const extra = cur.sub ? ` · ${cur.sub.filter(x=>x.status==='done').length} из ${cur.sub.length}` : '';
      nowText = `<span class="dot"></span>Сейчас: <b>${esc(cur.name)}${extra}</b>`;
    } else nowText = done===total ? '<b>Готово ✓</b>' : '<b>Ещё не начато</b>';
    body = `<ul class="steps">${t.steps.map(stepHTML).join('')}</ul>`;
  }
  const pct = total ? Math.round(done/total*100) : 0;
  const pub = t.publish ? `<span>Выход: ${when(t.publish)} (${hmMsk(new Date(t.publish))} МСК)</span>` : '';
  return `<details class="task"><summary>
    <div class="row"><span class="title">${esc(t.title)}</span><span class="chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></div>
    <div class="now-line">${nowText}</div>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.max(pct,2)}%"></i></div>
    <div class="meta"><span class="due">Будет готово: ${when(t.due)}</span>${pub}</div>
  </summary>${body}</details>`;
}
function doneHTML(x){
  const num = x.count!=null ? `<span class="num">${esc(x.count)}</span>` : '<span class="num ok">✓</span>';
  return `<li class="done-item">${num}<div><span class="dtitle">${esc(x.title)}</span>${x.detail?`<span class="ddetail">${esc(x.detail)}</span>`:''}</div></li>`;
}
function showTab(k){
  for(const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', b.dataset.tab===k);
  document.getElementById('p-now').hidden = k!=='now';
  document.getElementById('p-done').hidden = k!=='done';
  try{ history.replaceState(null,'', k==='done'?'#sdelano':location.pathname); }catch(e){}
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
if(location.hash==='#sdelano') showTab('done');
function render(data){
  const u = new Date(data.updated);
  document.getElementById('upd').textContent = `Обновлено ${dm(u)}, ${hm(u)} (по Иркутску)`;
  document.getElementById('tasks').innerHTML = data.tasks.map(taskHTML).join('');
  const D = data.done;
  if(D){ document.getElementById('done-h').textContent = D.title;
    document.getElementById('done').innerHTML = D.items.map(doneHTML).join(''); }
  else document.getElementById('t-done').hidden = true;
}
if(window.__DATA__) render(window.__DATA__);
else fetch('tasks.json',{cache:'no-store'}).then(r=>r.json()).then(render)
  .catch(()=>{document.getElementById('tasks').innerHTML='<div class="err">Не удалось загрузить данные. Обновите страницу.</div>';});
</script>
</body>
</html>
