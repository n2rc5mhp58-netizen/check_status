name: perenos-srokov
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: perenos-srokov
jobs:
  perenos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/perenos_srokov.py
      - run: |
          git diff --quiet tasks.json && exit 0
          git config user.name "perenos-srokov"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "Автоперенос сроков"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
